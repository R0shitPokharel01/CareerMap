<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Dashboard</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="aside.css" /><link rel="stylesheet" href="dashboard.css" />

    
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">
          <h2>Career Roadmap</h2>
          <span>Early-Career Navigator</span>
        </div>

        <nav id="sidebarMenu"></nav>

        <div class="sidebar-footer">
          <div class="profile">
            <img src="https://i.pravatar.cc/80" alt="profile" />
            <div>
              <h4 id="userName">Loading...</h4>
              <small id="userRole">Member</small>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <!-- Topbar -->
        <header class="topbar">
          <div class="search">
            <i class="fa fa-search"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Search roadmaps, skills or topics..."
            />
          </div>

          <div class="top-actions">
            <div class="btn-wrap">
              <button id="bellBtn">
                <i class="fa-regular fa-bell"></i>
              </button>
              <span id="notifBadge" class="badge-dot">0</span>
            </div>

            <div class="btn-wrap"></div>
          </div>
        </header>

        <!-- Hero -->
        <section class="hero">
          <div class="welcome-card">
            <h1 id="welcomeTitle">Welcome Back</h1>
            <p id="welcomeText">Loading...</p>
            <button id="resumeBtn">Resume Learning</button>
          </div>

          <div class="tip-card">
            <h3>Daily Career Tip</h3>
            <p id="dailyTip">Loading...</p>
          </div>
        </section>

        <!-- Stats -->
        <section id="statsContainer" class="stats-grid"></section>

        <!-- Content -->
        <section class="content-grid">
          <div class="activity">
            <div class="section-header">
              <h2>Weekly Activity</h2>
              <select id="chartRange">
                <option value="7">Last 7 Days</option>
                <option value="30">Last 30 Days</option>
              </select>
            </div>

            <canvas id="activityChart"></canvas>
            <div id="activityEmpty" class="empty-state" style="display: none">
              <i class="fa-solid fa-chart-line"></i>
              <p>
                No activity yet. Complete a task to start building your weekly
                streak chart.
              </p>
            </div>
          </div>

          <aside>
            <div class="tasks">
              <h2>Upcoming Tasks</h2>
              <div id="taskList"></div>
            </div>

            <div class="achievements-panel">
              <h2>Recent Achievements</h2>
              <div id="achievementContainer"></div>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <!-- Floating Button -->
    <button id="floatingBtn">
      <i class="fa fa-plus"></i>
    </button>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Sidebar Template -->
    <template id="menuTemplate">
      <a href="#">
        <i></i>
        <span></span>
      </a>
    </template>

    <!-- Stats Template -->
    <template id="statTemplate">
      <div class="stat-card">
        <div class="icon">
          <i></i>
        </div>
        <h4></h4>
        <h2></h2>
        <div class="sub"></div>
        <div class="progress">
          <div class="fill"></div>
        </div>
      </div>
    </template>

    <!-- Task Template -->
    <template id="taskTemplate">
      <div class="task">
        <input type="checkbox" />
        <div>
          <h4></h4>
          <small></small>
        </div>
      </div>
    </template>

    <!-- Achievement Template -->
    <template id="achievementTemplate">
      <span class="skill">
        <i class="fa-solid fa-trophy"></i>
        <span class="skill-label"></span>
      </span>
    </template>
    <script src="aside.js"></script>
   <script src="dashboard.js"></script>
  </body>
</html>
